name: AuricAI website - real desktop and Android browser QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'assets/**'
      - 'release.json'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check download hash metadata and markup
        run: |
          python3 - <<'PY'
          import hashlib,json,re,urllib.request
          from pathlib import Path
          d=json.loads(Path('release.json').read_text())
          for key in ('windows','android'):
            meta=d[key]
            assert re.fullmatch(r'[a-f0-9]{64}',meta['sha256'])
            assert meta['bytes']>100000
            assert meta['file'].lower().endswith('.exe' if key=='windows' else '.apk')
          if d.get('channel')=='verified' and d.get('publicDownloads') is True:
            assert d.get('firebaseConfigured') is True
            assert d.get('gatewayConfigured') is True
            req=urllib.request.Request(
              'https://api.github.com/repos/MIDASYT/AuricAI-Web/releases/tags/v'+d['version'],
              headers={'User-Agent':'AuricAI-release-qa'})
            release=json.load(urllib.request.urlopen(req,timeout=25))
            assets={asset['name']:asset for asset in release.get('assets',[])}
            for key in ('windows','android'):
              meta=d[key];asset=assets.get(meta['file'])
              assert asset is not None and asset['size']==meta['bytes']
          assert d.get('downloadRepository')=='MIDASYT/AuricAI-Web'
          for key in ('windows','android'):
            expected='https://github.com/MIDASYT/AuricAI-Web/releases/download/v'+d['version']+'/'+d[key]['file']
            assert d[key]['url']==expected
          # Historical testing builds may still exist on GitHub Pages, but the
          # public site must never surface them as official downloads.
          html=Path('index.html').read_text()
          assert 'assets/android.svg' in html
          assert 'assets/auricai-logo.png' in html
          assert 'id="instalacion"' in html
          assert 'midasyt.github.io/AuricAI/auricai/' not in html
          PY
      - name: Capture real browser screenshots
        run: |
          npm install --no-save --no-audit --no-fund playwright
          python3 -m http.server 8999 --directory . --bind 127.0.0.1 >/tmp/auricai-web.log 2>&1 &
          mkdir -p screenshots
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
          for(const item of [{name:'desktop',width:1440,height:900,mobile:false},{name:'android',width:390,height:844,mobile:true}]){
            const page=await browser.newPage({viewport:{width:item.width,height:item.height},isMobile:item.mobile,hasTouch:item.mobile,deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:8999/',{waitUntil:'networkidle'});
            await page.locator('#downloadStatus').waitFor();
            const images=await page.locator('img').evaluateAll(nodes=>nodes.map(img=>({src:img.getAttribute('src'),loaded:img.complete&&img.naturalWidth>0})));
            if(images.some(i=>!i.loaded))throw Error('Missing asset: '+JSON.stringify(images.filter(i=>!i.loaded)));
            if(!await page.evaluate(()=>document.documentElement.scrollWidth <= window.innerWidth + 2)) throw Error('Horizontal overflow on '+item.name);
            const release=JSON.parse((await import('node:fs')).readFileSync('release.json','utf8'));
            const production=release.channel==='verified' && release.firebaseConfigured===true && release.gatewayConfigured===true;
            const disabled=await page.locator('a[data-platform][aria-disabled="true"]').count();
            if(production && disabled)throw Error('Verified native downloads are missing: '+item.name);
            if(!production && disabled!==2)throw Error('Experimental downloads must not be presented as stable: '+item.name);
            await page.screenshot({path:'screenshots/AuricAI-'+item.name+'-site.png',fullPage:true});
            await page.close();
          }
          await browser.close();
          JS
      - name: Preserve real screenshots inside the AuricAI project
        shell: bash
        run: |
          mkdir -p qa/visual
          cp screenshots/*.png qa/visual/
          git config user.name 'auric-qa[bot]'
          git config user.email 'auric-qa[bot]@users.noreply.github.com'
          git add qa/visual/
          git diff --cached --quiet || (git commit -m 'Record verified AuricAI mobile and desktop browser screenshots' && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: AuricAI-official-site-screenshots
          path: screenshots/
          retention-days: 45
