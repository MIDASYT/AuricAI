name: AuricAI — publish live website to shared Firebase project
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.AURIC_FIREBASE_PROJECT_ID }}
      HAS_HOSTING_CREDENTIALS: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration without printing credentials
        shell: bash
        run: |
          if [[ -z "$PROJECT_ID" || "$HAS_HOSTING_CREDENTIALS" != "true" ]]; then
            echo "::error::Shared Firebase Hosting is not configured; this cannot be marked deployed." >&2
            exit 1
          fi
      - name: Gate Hosting on verified AuricAI installers and live Firebase services
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('release.json'))
          if d.get('channel')!='verified' or d.get('firebaseConfigured') is not True or d.get('gatewayConfigured') is not True:
              raise SystemExit('AuricAI remains unverified. Production Hosting is blocked.')
          for k in ('windows','android'):
              a=d.get(k)
              if not isinstance(a,dict) or len(a.get('sha256',''))!=64 or a.get('bytes',0)<100000:
                  raise SystemExit('Missing verified '+k+' release')
          PY
      - name: Deploy validated site to Firebase live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT }}
          projectId: ${{ env.PROJECT_ID }}
          channelId: live
      - name: Check actual Firebase site after publication
        if: env.PROJECT_ID != '' && env.HAS_HOSTING_CREDENTIALS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          html="$(mktemp)"
          response="$(curl -L -sS --max-time 30 -o "$html" -w '%{http_code}' 'https://auric-ai.web.app/')"
          test "$response" = 200
          grep -qi 'AuricAI' "$html"
