name: Import AuricAI 0.1.3 signed Windows + Android prerelease
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-013.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download already-compiled native installers
        shell: bash
        env:
          WINDOWS_ARTIFACT: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f250-820e-97c0-9c094efd594b/raw?se=2026-11-07T00%3A08%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=c6db1161-08ca-53a5-a72f-2bd46222fd74&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T18%3A29%3A47Z&ske=2026-11-07T18%3A29%3A47Z&sks=b&skv=2026-02-06&sig=2sydbguJMt7I/AXcYZJwGL%2B6DoU0x85aPXNLz2HUkg8%3D'
          ANDROID_ARTIFACT: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-31dc-820e-b6ce-2ea54281f4a1/raw?se=2026-11-07T00%3A08%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=2fce7367-e6b4-5806-a741-9cf5dcd2bbc5&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T18%3A16%3A45Z&ske=2026-11-07T18%3A16%3A45Z&sks=b&skv=2026-02-06&sig=YT2XDxjilyI5YMUp7EuXRobWnw5SFprYv8I9kYXctaQ%3D'
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl --fail --location --retry 2 --max-time 180 --silent --show-error "$WINDOWS_ARTIFACT" --output /tmp/auricai-windows.zip
          curl --fail --location --retry 2 --max-time 180 --silent --show-error "$ANDROID_ARTIFACT" --output /tmp/auricai-android.zip
          unzip -jo /tmp/auricai-windows.zip -d downloads
          unzip -jo /tmp/auricai-android.zip -d downloads
          cd downloads
          echo '1432551a1b86526670e8a6eb7d0eb65aec3fdb4396e8aa8d35c1d5a3a6e36b2b  AuricAI_0.1.3_x64-setup.exe' | sha256sum --check
          echo 'da761294baba8bbe54596f7c09fd9a9dd0e6c2d72b267d07946face41aca163a  AuricAI-0.1.3-Android-ARM64-test.apk' | sha256sum --check
      - name: Write checked version manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder=Path('downloads')
          def info(name,sha):
            return {'file':name,'sha256':sha,'bytes':(folder/name).stat().st_size}
          data={
            'version':'0.1.3','channel':'testing',
            'firebaseConfigured':False,'gatewayConfigured':False,
            'windows':info('AuricAI_0.1.3_x64-setup.exe','1432551a1b86526670e8a6eb7d0eb65aec3fdb4396e8aa8d35c1d5a3a6e36b2b'),
            'android':info('AuricAI-0.1.3-Android-ARM64-test.apk','da761294baba8bbe54596f7c09fd9a9dd0e6c2d72b267d07946face41aca163a'),
            'history':[]
          }
          Path('release.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Publish retained binaries in own AuricAI repository
        shell: bash
        run: |
          git config user.name 'auric-build[bot]'
          git config user.email 'auric-build[bot]@users.noreply.github.com'
          git add downloads/ release.json
          if ! git diff --cached --quiet; then
            git commit -m 'Keep AuricAI 0.1.3 signed native installers in its own repository with SHA256'
            git push
          fi
